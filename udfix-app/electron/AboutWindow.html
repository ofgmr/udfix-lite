<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>UDFIX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(165deg, #f4f7f6 0%, #e8eeec 100%);
      color: #1a2424;
      padding: 28px 24px;
      text-align: center;
      -webkit-app-region: drag;
    }
    img {
      width: 128px;
      height: auto;
      margin-bottom: 12px;
      -webkit-app-region: no-drag;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .tagline {
      margin: 0 0 4px;
      font-size: 13px;
      color: #3d5c5c;
      max-width: 260px;
      line-height: 1.4;
    }
    .version {
      margin: 10px 0 0;
      font-size: 12px;
      color: #5a6b6b;
    }
    .developer {
      margin-top: 14px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <img id="logo" src="branding/10-l_logo.svg" width="128" height="128" alt="UDFIX Logo" />
  <p class="tagline">Tek ekran, akıllı editör, güçlü arşiv.</p>
  <p class="version" id="version"></p>
  <p class="developer">©2025-2026 OFG</p>
  <script>
    const params = new URLSearchParams(location.search);
    const v = params.get('v');
    document.getElementById('version').textContent = v ? 'Sürüm ' + v : '';
    const logoFile = params.get('logoFile');
    if (logoFile && /^[A-Za-z0-9._-]+\.(svg|png|webp)$/.test(logoFile)) {
      document.getElementById('logo').src = 'branding/' + logoFile;
    }
  </script>
</body>
</html>
